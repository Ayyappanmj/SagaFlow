[project]
name = "sagaflow"
version = "1.0.0"
description = "Distributed transaction & saga orchestration platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
norecursedirs = [".*", "node_modules", "frontend", "dist", "build"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E702", "B008", "UP007"]

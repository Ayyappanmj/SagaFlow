# Disposable local-dev stack. Ports are bound to 127.0.0.1 only; credentials come from .env.
x-backend: &backend
  build: .
  env_file: .env
  environment: &backend-env
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    ORCHESTRATOR_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orchestrator
    INVENTORY_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory
    PAYMENT_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment
    SHIPPING_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/shipping
    INVENTORY_URL: http://inventory:8001
    PAYMENT_URL: http://payment:8002
    SHIPPING_URL: http://shipping:8003
    ORCHESTRATOR_URL: http://orchestrator:8010
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["127.0.0.1:15672:15672"]   # management UI, localhost only
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  orchestrator:
    <<: *backend
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8010
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  inventory:
    <<: *backend
    command: uvicorn inventory_service.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  payment:
    <<: *backend
    command: uvicorn payment_service.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  shipping:
    <<: *backend
    command: uvicorn shipping_service.main:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  rabbitmqdata:
  grafanadata:
